services:
  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "4000:4000"
      - "35729:35729"

    volumes:
      - ..:/site

    environment:
      JEKYLL_ENV: development

    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --livereload
      - --force_polling
